name: Cloud validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPAT_PROD_BASELINE: baseline/cloud.lock.json
  DISABLE_AUTOUPDATER: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: false
      - name: Install system and client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof
          npm install -g @anthropic-ai/claude-code@2.1.215 --no-audit --no-fund
      - name: Bootstrap pinned upstream source
        run: python3 scripts/bootstrap-cloud.py
      - name: Python harness tests
        run: make test
      - name: Cloud production-absence guard
        run: make check-prod
      - name: Source boundary contracts
        run: make source-boundary-check
      - name: Full source validation
        run: make source-validation
      - name: Reproducible candidate build
        run: make build-candidate
      - name: Candidate bottle matrix
        run: make candidate-bottle-check
      - name: Synthetic OAuth matrix
        run: make synthetic-oauth-check
      - name: Claude Code end-to-end matrix
        run: make claude-code-e2e
      - name: Upload sanitized validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cloud-validation-reports-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .runs/**/environment.json
            .runs/**/cases.json
            .runs/**/evidence.ndjson
            .runs/**/junit.xml
            .runs/**/rating.json
            .runs/**/report.md
            .runs/**/protocol-contracts.json
            .runs/**/protocol-contracts.md
            .runs/**/source-validation.json
            .runs/**/candidate-build.json
            .runs/**/synthetic-oauth.json
            .runs/**/claude-code-e2e.json
            .runs/**/claude-code-e2e.md
